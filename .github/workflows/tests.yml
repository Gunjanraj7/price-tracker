# Runs every test on each push and pull request: the Python tests on SQLite and
# on PostgreSQL, and the dashboard's type check, build and tests.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]      # the oldest supported version, and the newest

    # A throwaway PostgreSQL for `pytest --postgres`. It only exists while the
    # job runs, so its password is not a secret.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: price_tracker
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: price_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U price_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Tests on SQLite
        run: python -m pytest

      - name: Tests on PostgreSQL
        run: python -m pytest --postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://price_tracker:ci-only-password@localhost:5432/price_tracker_test

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Tests
        run: npm test
