# For the `alembic` command, run from the project folder. The app itself runs
# the migrations when it opens the database, so you only need this to write a
# new migration (see "Changing the tables" in the README). The database is
# DATABASE_URL, or price_tracker.db; migrations/env.py works it out.

[alembic]
script_location = %(here)s/price_tracker/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
